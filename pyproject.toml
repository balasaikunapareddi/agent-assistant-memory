[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-assistant-memory"
version = "0.1.0"
description = "How an AI assistant maintains memory and sessions: a durable memory store with provenance and corrections, multi-session continuity, and LLM compaction that keeps long conversations inside a token budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bala Sai Kunapareddi" }]
dependencies = [
    "litellm>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assistant-memory-demo = "agent_assistant_memory.demo:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
